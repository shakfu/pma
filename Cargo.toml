[package]
name = "pma"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
description = "Maintain many git repositories from one place: rank their TODO.md tasks and hand them to coding agents"
license = "MIT"
repository = "https://github.com/shakfu/pma"
readme = "README.md"
keywords = ["todo", "eisenhower", "git", "maintenance", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
# Workflow documents may be generated by a script. `no_time` and `no_module`
# remove the clock and the module system at compile time rather than at run
# time: a generated document must be the same on every machine.
rhai = { version = "1.26.1", default-features = false, features = [
    "std",
    "no_time",
    "no_module",
] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
