[workspace]
members = ["crates/pma-box", "crates/pma-core", "crates/pma-tui", "crates/pma-web", "crates/pma"]
resolver = "3"

[workspace.package]
version = "0.10.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/shakfu/pma"

[workspace.dependencies]
# A version beside each path, so `cargo publish` can name the published crate.
pma-core = { path = "crates/pma-core", version = "0.10.0" }
pma-tui = { path = "crates/pma-tui", version = "0.10.0" }
pma-web = { path = "crates/pma-web", version = "0.10.0" }
# Parses request headers for `pma web`.
httparse = "1.10.1"
clap = { version = "4.6.6", features = ["derive"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
# Workflow documents may be generated by a script. `no_time` and `no_module`
# remove the clock and the module system at compile time rather than at run
# time: a generated document must be the same on every machine.
rhai = { version = "1.26.1", default-features = false, features = [
    "std",
    "no_time",
    "no_module",
] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Confines verify's writes to the worktree. Exact: 0.1 has no stable API.
sanduk-sandbox = "=0.1.0"
serde_json = "1.0.151"
toml_edit = "0.25.15"
