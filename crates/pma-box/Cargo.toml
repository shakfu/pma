[package]
name = "pma-box"
description = "Run a coding agent in a disposable container, with the API key held on the host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
# The relay. hyper for both ends: one HTTP/1.1 connection per upstream call, and a server whose
# response body is a channel the forwarding task fills.
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
# ring rather than rustls's default aws-lc-rs, which needs cmake to build.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
# raw_value, not preserve_order: Cargo unifies features, so preserve_order would change the key
# order of every serde_json::Map in pma. raw_value is additive.
serde_json = { workspace = true, features = ["raw_value"] }
# The top level of a body the policy rewrites, in its own order, values kept byte for byte.
indexmap = { version = "2", features = ["serde"] }
# Agent specs are TOML; recipes and kits stay JSON, which their pins hash byte for byte.
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# Kit pins and image tags. ring is already linked for TLS.
ring = "0.17"

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW for request-body log files; getuid and getgid for build args.
libc = "0.2"

[dev-dependencies]
# An independent SHA-256 for the tests' expected pins and tags.
sha2 = "0.10"
# The patterns `check` replaced, as its oracle.
regex = "1"
