<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>pma</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Views">
    <div class="brand">
      <span class="logo" aria-hidden="true">pma</span>
      <span class="brand-text">portfolio</span>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div id="anywhere" class="anywhere" role="group" aria-label="Actions on any view"></div>
      <span id="busy" class="busy" role="status">Connecting</span>
      <button id="help-button" class="link" type="button">Keyboard shortcuts <kbd>?</kbd></button>
    </div>
  </aside>

  <main class="main" id="main">
    <header class="topbar">
      <div class="heading">
        <h1 id="title">pma</h1>
        <p id="subtitle"></p>
      </div>
      <div id="toolbar" class="toolbar" role="toolbar" aria-label="Actions on this view"></div>
    </header>
    <div id="content" class="content"></div>
    <form id="cmdline" class="cmdline hidden" autocomplete="off">
      <div id="cmd-names" class="cmd-names" role="listbox" aria-label="Completions"></div>
      <div id="cmd-label" class="cmd-label"></div>
      <label class="cmd-row"><span id="cmd-lead" aria-hidden="true">:</span><textarea id="cmd-input" rows="1" wrap="off" spellcheck="false" aria-label="Command; Tab completes"></textarea><span id="cmd-hint" class="cmd-hint"></span></label>
    </form>
  </main>

</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<dialog id="dialog" aria-labelledby="dialog-title">
  <form id="dialog-form" method="dialog">
    <h2 id="dialog-title"></h2>
    <div id="dialog-text" class="dialog-text"></div>
    <div class="dialog-buttons">
      <button id="dialog-cancel" class="button" value="cancel" type="submit">Cancel</button>
      <button id="dialog-ok" class="button primary" value="ok" type="submit">OK</button>
    </div>
  </form>
</dialog>
</body>
</html>
